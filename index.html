.wk-habit.done{color:#444b49;background:#e8eee9}.wk-habit.done::before{color:white;background:#7f9f8b;border-color:#7f9f8b}
.wk-timeline{height:864px;position:relative;overflow:hidden;background:repeating-linear-gradient(to bottom,#fbfbfa 0px,#fbfbfa 35px,#d5d7d72b 35px,#d5d7d72b 36px)}
.wk-timeline:nth-child(even){background:repeating-linear-gradient(to bottom,#f5f5f4 0px,#f5f5f4 35px,#d5d7d72b 35px,#d5d7d72b 36px)}
.wk-timeaxis{height:864px;position:relative;background:#f9f9f8}

.wk-slot{width:100%;height:36px;position:absolute;left:0;z-index:1;padding:0;cursor:crosshair;border-radius:0}
.wk-slot:hover{background:rgba(100,105,112,.09)}
.wk-block{position:absolute;z-index:3;left:4px;right:4px;border:1px solid color-mix(in srgb,var(--slot-color) 27%,transparent);border-left:3px solid var(--slot-color);background:color-mix(in srgb,var(--slot-color) 24%,#fff 76%);color:#44464c;text-align:left;font-weight:740;font-size:10px;line-height:1.25;padding:4px 5px;border-radius:5px;overflow:hidden;display:flex;align-items:flex-start;flex-direction:column;gap:2px;min-height:16px;box-shadow:0 1px 1px #00000007;transition:filter .15s}
.wk-block:hover{filter:brightness(.96);z-index:5}
.wk-block.actual{background:color-mix(in srgb,var(--slot-color) 42%,#fff 58%)}
.wk-block .slot-text{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.wk-block .slot-time{font-size:9px;opacity:.65;white-space:nowrap}
.wk-block.compact{justify-content:center;padding:1px 5px}
.wk-block.compact .slot-text{white-space:nowrap;text-overflow:ellipsis;display:block;max-width:100%;font-size:9px}
.wk-block.compact .slot-time{display:none}
.wk-bottom{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 17px;background:#f3f3f1;border-top:1px solid #dbdcda;font-size:11px;color:#747679}

.day-journal{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(288px,1fr);align-items:start;gap:16px}

.day-time-top>span:nth-child(2){background:#ececea}

.day-lane .wk-block{font-size:12px;padding:6px 8px}.day-lane .wk-block.compact{font-size:10px;padding:2px 5px}.day-lane .wk-block .slot-time{font-size:10px}

/* v0.9 — Live appearance controls + charcoal liquid glass */
:root{--panel-rgb:255,255,255;--glass-fill:.32;--glass-blur:34px;--glass-edge:.64;--background-power:.66;--canvas-base:#e4e8ef;--surface-ink:#273243;--surface-secondary:#667386;--divider-color:rgba(73,85,106,.14)}

.ambient{background:var(--canvas-base)}
.ambient::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 86% 72% at 8% 12%,#ffffffbb,transparent 75%),radial-gradient(ellipse 64% 70% at 84% 72%,#8fa5c887,transparent 75%),linear-gradient(132deg,#d7dee9,#f2f4f7 50%,#c5cedf);opacity:var(--background-power);pointer-events:none}

.calendar-panel,.todo-panel,.day-time-card{background:transparent}

/* Appearance sheet */
.appearance-dialog{z-index:95}.appearance-dialog .modal{max-width:526px;max-height:min(90vh,800px);overflow:auto}
.appear-section{margin:18px 0 0;padding:16px;border:1px solid rgba(255,255,255,.36);border-radius:17px;background:rgba(var(--panel-rgb),.13)}
.appear-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 13px;color:var(--ink);font-weight:800;font-size:13px}
.appear-section-title output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--sub);font-weight:760}
.appearance-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.appearance-option{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 5px;border-radius:13px;border:1px solid rgba(255,255,255,.36);background:rgba(var(--panel-rgb),.19);font-size:12px;font-weight:750;white-space:nowrap;color:var(--sub);transition:.2s}

.appear-preview-item{border-radius:13px;padding:12px;background:rgba(var(--panel-rgb),var(--glass-fill));backdrop-filter:blur(var(--glass-blur));border:1px solid rgba(255,255,255,var(--glass-edge));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);display:flex;flex-direction:column;justify-content:center;gap:6px}

/* v1.0 — multi-category on/off calendar filter */
.calendar-multi-filter{position:relative;margin-bottom:17px;padding:15px 16px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.43),rgba(255,255,255,.23));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,.60);box-shadow:0 12px 26px rgba(41,50,67,.075),inset 0 1px 0 rgba(255,255,255,.82)}
.cal-filter-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.cal-filter-heading>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.cal-filter-heading strong{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink)}
.cal-filter-heading small{font-size:11px;color:var(--sub)}
.cal-filter-count{flex-shrink:0;color:var(--sub);font-size:10px;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.52);border-radius:20px;padding:6px 10px}
.cal-filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-filter-all,.cal-filter-toggle{display:inline-flex;align-items:center;gap:9px;min-height:38px;border-radius:13px;padding:7px 11px;font-weight:730;font-size:11px;background:linear-gradient(180deg,rgba(255,255,255,.50),rgba(255,255,255,.20));border:1px solid rgba(255,255,255,.54);box-shadow:inset 0 1px 0 rgba(255,255,255,.76),0 5px 13px rgba(52,64,84,.055);transition:opacity .16s,background .16s,transform .16s;color:var(--ink)}
.cal-filter-toggle.inactive{opacity:.62;background:rgba(255,255,255,.10)}
.cal-filter-all.active{color:#fff;background:linear-gradient(145deg,#606d7f,#3e4b5f);border-color:rgba(255,255,255,.25)}
.cal-filter-all:hover,.cal-filter-toggle:hover{transform:translateY(-1px)}
.cal-cat-dot{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:var(--cat-color);box-shadow:0 0 0 2px rgba(255,255,255,.42)}
.cal-switch{display:inline-flex;align-items:center;width:29px;height:17px;border-radius:999px;padding:2px;background:rgba(118,125,138,.35);border:1px solid rgba(255,255,255,.3);transition:background .2s;flex-shrink:0}
.cal-switch span{display:block;width:11px;height:11px;border-radius:50%;background:#f7f8fa;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
.cal-switch.on{background:#6c808a}.cal-switch.on span{transform:translateX(12px)}
.cal-onoff{font-size:9px;min-width:19px;text-align:left;letter-spacing:.02em;color:var(--sub)}
.cal-filter-help{color:var(--sub);font-size:10px;margin-top:11px;line-height:1.45}
.cal-empty-filter{font-size:11px;margin-top:12px;padding:11px 12px;border:1px dashed rgba(95,105,123,.34);border-radius:11px;color:var(--sub)}
html[data-theme="dark"] .calendar-multi-filter{background:rgba(var(--panel-rgb),var(--glass-fill));border-color:rgba(226,240,255,calc(var(--glass-edge) * .27));box-shadow:0 14px 34px rgba(0,0,0,.19),inset 0 1px 0 rgba(238,246,255,.11)}
html[data-theme="dark"] .cal-filter-all,html[data-theme="dark"] .cal-filter-toggle{background:linear-gradient(180deg,rgba(120,140,173,.15),rgba(58,72,96,.23));border-color:rgba(211,227,255,.14);color:#ecf2fb;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
html[data-theme="dark"] .cal-filter-all.active{background:linear-gradient(145deg,rgba(147,172,208,.39),rgba(93,113,147,.43));border-color:rgba(220,233,255,.31)}
html[data-theme="dark"] .cal-filter-toggle.inactive{background:rgba(37,48,66,.20);opacity:.6}
html[data-theme="dark"] .cal-filter-count{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.11)}
html[data-theme="dark"] .cal-switch{background:rgba(115,130,154,.38)}
html[data-theme="dark"] .cal-switch.on{background:#7a9bad}
@media(max-width:540px){.calendar-multi-filter{padding:13px 12px;border-radius:16px}.cal-filter-actions{gap:7px}.cal-filter-toggle{padding:7px 9px}.cal-filter-heading{align-items:start}.cal-filter-count{margin-top:1px}.cal-onoff{display:none}}


/* v1.1 · hidden categories remain visible as anonymous category dots */
.cal-hidden-dots{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:9px;margin:1px 2px 2px;max-width:100%}
.cal-hidden-dot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--hidden-color,#999);box-shadow:0 0 0 1.5px rgba(255,255,255,.33),0 1px 4px rgba(0,0,0,.09);opacity:.88}
.cal-hidden-dots.in-week{justify-content:center;padding:3px 1px 5px}
.cal-hidden-dots.in-day{min-height:21px;gap:7px;margin:4px 0 9px}
.cal-hidden-dots.in-day .cal-hidden-dot{width:9px;height:9px}
.cal-hidden-dots.in-detail{margin:8px 0 5px}
.calendar-privacy-hint{font-size:10px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:6px}
/* v1.1 · independent rich-text notes */
.memo-layout{display:grid;grid-template-columns:minmax(235px,.73fr) minmax(0,1.55fr);gap:15px;align-items:start}
.memo-list-panel,.memo-editor-panel{min-height:555px;padding:18px}
.memo-list-panel{display:flex;flex-direction:column;gap:10px}
.memo-search{width:100%;min-height:43px;border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink);border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.42);outline:none}
.memo-list-scroll{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:calc(100vh - 315px);min-height:180px}
.memo-list-item{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.22);border-radius:15px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:7px;transition:.16s;min-height:80px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.memo-list-item.active{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.76),0 6px 17px rgba(51,63,85,.09)}
.memo-list-item:hover{background:rgba(255,255,255,.44)}
.memo-list-item strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo-list-item small{font-size:10px;color:var(--sub)}
.memo-list-item .excerpt{font-size:11px;color:var(--sub);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.memo-editor-panel{display:flex;flex-direction:column;gap:13px}
.memo-editor-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.memo-editor-head small{font-size:11px;color:var(--sub)}
.memo-title{width:100%;font-size:24px;line-height:1.35;font-weight:780;letter-spacing:-.045em;padding:10px 5px;border:0;border-bottom:1px solid rgba(110,124,146,.22);background:transparent;color:var(--ink);outline:none}
.memo-title::placeholder{color:#8994a5}
.memo-toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:8px;background:rgba(255,255,255,.27);border:1px solid rgba(255,255,255,.46);border-radius:14px}
.memo-toolbar button{min-width:36px;min-height:35px;display:inline-flex;justify-content:center;align-items:center;gap:6px;border-radius:10px;background:rgba(255,255,255,.25);border:1px solid transparent;font-size:12px;font-weight:740;color:var(--ink);padding:7px 9px}
.memo-toolbar button:hover,.memo-toolbar button[aria-pressed=true]{background:rgba(255,255,255,.65);border-color:rgba(255,255,255,.7)}
.memo-toolbar .memo-tool-label{font-size:11px;font-weight:690}
.memo-toolbar .memo-tool-split{height:23px;width:1px;background:rgba(112,124,143,.22);margin:0 3px}
.memo-body{border:1px solid rgba(255,255,255,.53);border-radius:16px;background:rgba(255,255,255,.38);min-height:380px;padding:20px;color:var(--ink);outline:none;font-size:14px;line-height:1.85;overflow-wrap:anywhere;white-space:normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

const progress=()=>{const arr=tasks.filter(t=>t.date===todayKey),done=arr.filter(t=>t.done).length;return {all:arr.length,done,pct:arr.length?Math.round(done/arr.length*100):0}};
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2700)}

// v1.2 · Today's affirmation — user-managed quote collection with daily stable random selection.
const QUOTES_KEY='hope-v12-affirmations';
const DAILY_AFFIRMATION_KEY='hope-v12-daily-affirmation';
const starterQuotes=[];
let quotes=restore(QUOTES_KEY,starterQuotes).filter(q=>q&&typeof q.id==='string'&&typeof q.text==='string').map(q=>({id:q.id,text:q.text,author:typeof q.author==='string'?q.author:'',createdAt:q.createdAt||Date.now()}));
let dailyAffirmation=null;
try{const stored=JSON.parse(localStorage.getItem(DAILY_AFFIRMATION_KEY)||'null');if(stored&&typeof stored.date==='string'&&typeof stored.id==='string')dailyAffirmation=stored}catch(e){}
function saveQuotes(){try{localStorage.setItem(QUOTES_KEY,JSON.stringify(quotes))}catch(e){toast('명언 저장 공간을 확인해 주세요.')}}
function dailyQuote(){
 const d=datekey(new Date());
 if(!quotes.length)return null;
 if(dailyAffirmation?.date===d){const kept=quotes.find(q=>q.id===dailyAffirmation.id);if(kept)return kept}
 let pool=quotes;
 if(dailyAffirmation?.date!==d&&dailyAffirmation?.id&&quotes.length>1){
   const different=quotes.filter(q=>q.id!==dailyAffirmation.id);
   if(different.length)pool=different;
 }
 const chosen=pool[Math.floor(Math.random()*pool.length)];
 dailyAffirmation={date:d,id:chosen.id};
 try{localStorage.setItem(DAILY_AFFIRMATION_KEY,JSON.stringify(dailyAffirmation))}catch(e){}
 return chosen;
}

 <div class="quote-card-footer"><span class="quote-author">${q.author?`— ${esc(q.author)}`:'나만의 문장'}</span><div class="quote-actions"><button type="button" data-quote-edit="${esc(q.id)}" aria-label="명언 수정" title="명언 수정">${ico('edit','sm')}</button><button type="button" data-quote-delete="${esc(q.id)}" aria-label="명언 삭제" title="명언 삭제">${ico('trash','sm')}</button></div></div>
 </article>`}

function monthView(){
  const y=state.visibleMonth.getFullYear(),m=state.visibleMonth.getMonth(),days=monthCells(y,m);
  const headings=`<div class="weekday-row">${['월','화','수','목','금','토','일'].map((s,i)=>`<div class="weekday ${i>4?'weekend':''}">${s}</div>`).join('')}</div>`;
  const rows=Array.from({length:6},(_,w)=>{
    const week=days.slice(w*7,w*7+7);
    const weekStart=week[0].key,weekEnd=week[6].key;
    // 기간 일정만 일주일 안에서 하나의 막대로 배치한다.
    // 겹치는 일정은 별도의 행을 배정하여 막대가 포개지지 않도록 한다.
    const spans=events.filter(e=>matchesCategory(e.category,'calendar')&&isRange(e)&&e.date<=weekEnd&&(e.endDate||e.date)>=weekStart)
      .map(e=>({e,start:Math.max(0,week.findIndex(d=>d.key>=e.date)),end:Math.min(6,6-[...week].reverse().findIndex(d=>d.key<=(e.endDate||e.date)))}))
      .sort((a,b)=>a.start-b.start||b.end-a.end||a.e.id.localeCompare(b.e.id));
    const lanes=[];
    for(const item of spans){let lane=lanes.findIndex(lastEnd=>lastEnd<item.start);if(lane===-1){lane=lanes.length;lanes.push(-1)}lanes[lane]=item.end;item.lane=lane}
    const weekDates=week.map(d=>{
      const singles=d.ev.filter(e=>matchesCategory(e.category,'calendar')&&!isRange(e));
      const cMarkup=singles.slice(0,2).map(e=>{const c=catOf(e.category);return `<span class="date-chip custom" style="--chip-bg:${c.color}24;--chip-fg:${c.color};--cat-color:${c.color}" data-event-id="${esc(e.id)}" title="${esc(e.title)}">${esc(e.title)}</span>`}).join('');
      return `<button class="date-cell ${!d.monthSame?'other':''} ${d.key===state.selected?'selected':''} ${d.key===todayKey?'today':''}" style="--week-lanes:${lanes.length}" data-day="${d.key}" aria-label="${d.key} 선택"><span class="date-num">${d.d.getDate()}</span><span class="cell-items">${cMarkup}${hiddenCalendarDots(d.key)}${d.td.some(t=>matchesCategory(t.category,'calendar'))?'<span class="date-dots"><i class="todo-dot"></i></span>':''}${singles.length>2?'<span class="date-dots"><i></i><i></i></span>':''}${singles.length?`<span class="mobile-event-mark">${singles.slice(0,2).map(e=>`<i style="--cat-color:${catOf(e.category).color}"></i>`).join('')}</span>`:''}</span></button>`;
    }).join('');
    const bars=spans.map(({e,start,end,lane})=>{const c=catOf(e.category),begins=e.date>=weekStart,ends=(e.endDate||e.date)<=weekEnd;return `<button class="range-strip ${begins?'begins':'continues'} ${ends?'ends':'to-next'}" style="grid-column:${start+1} / span ${end-start+1};grid-row:${lane+1};--range-color:${c.color}" data-event-id="${esc(e.id)}" aria-label="${esc(e.title)} ${esc(dateRangeText(e))} 일정 수정" title="${esc(e.title+' · '+dateRangeText(e))}"><span>${esc(e.title)}</span></button>`}).join('');
    return `<div class="calendar-week" style="--week-lanes:${lanes.length}">${weekDates}<div class="week-range-layer" aria-label="기간 일정">${bars}</div></div>`;
  }).join('');
  return `<div class="month-grid">${headings}${rows}</div>`;
}

const MEMO_ALLOWED=new Set(['DIV','P','BR','B','STRONG','I','EM','S','STRIKE','DEL','UL','OL','LI','SPAN','BUTTON']);
function cleanMemoHtml(html){const root=document.createElement('div');root.innerHTML=String(html||'');function scrub(node){if(node.nodeType===3)return document.createTextNode(node.nodeValue);if(node.nodeType!==1)return document.createDocumentFragment();if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','FORM','IMG','VIDEO','AUDIO'].includes(node.tagName))return document.createDocumentFragment();if(!MEMO_ALLOWED.has(node.tagName)){const frag=document.createDocumentFragment();Array.from(node.childNodes).forEach(ch=>frag.append(scrub(ch)));return frag}const el=document.createElement(node.tagName.toLowerCase());if(node.classList.contains('memo-check-item')&&node.tagName==='DIV'){el.className='memo-check-item'+(node.classList.contains('checked')?' checked':'');el.setAttribute('contenteditable','false')}
if(node.classList.contains('memo-check-text')&&node.tagName==='SPAN'){el.className='memo-check-text';el.setAttribute('contenteditable','true')}
if(node.classList.contains('memo-check-box')&&node.tagName==='BUTTON'){el.className='memo-check-box';el.setAttribute('type','button');el.setAttribute('data-note-check','');el.setAttribute('aria-label','완료 여부 변경')}
Array.from(node.childNodes).forEach(ch=>el.append(scrub(ch)));return el}const safe=document.createElement('div');Array.from(root.childNodes).forEach(n=>safe.append(scrub(n)));return safe.innerHTML}
function addMemo(){const note={id:newId('memo'),title:'',body:'',updatedAt:Date.now()};memos.unshift(note);currentMemoId=note.id;memoSearchTerm='';persistMemos();render();document.getElementById('memoTitle')?.focus()}
function noteUpdate(withList=false){if(state.page!=='notes')return;const curr=memos.find(n=>n.id===currentMemoId);if(!curr)return;const title=document.getElementById('memoTitle');const body=document.getElementById('memoBody');if(title)curr.title=title.value;if(body)curr.body=cleanMemoHtml(body.innerHTML);curr.updatedAt=Date.now();persistMemos();if(withList)refreshMemoList()}
let memoListRefreshTimer=null;
function queueMemoRefresh(){clearTimeout(memoListRefreshTimer);memoListRefreshTimer=setTimeout(refreshMemoList,280)}
function refreshMemoList(){if(state.page!=='notes')return;const list=document.getElementById('memoList');if(!list)return;const filtered=[...memos].filter(n=>!memoSearchTerm||(n.title+' '+noteText(n)).toLocaleLowerCase().includes(memoSearchTerm.toLocaleLowerCase())).sort((a,b)=>b.updatedAt-a.updatedAt);list.innerHTML=filtered.map(n=>`<button class="memo-list-item ${currentMemoId===n.id?'active':''}" data-note-select="${esc(n.id)}"><strong>${esc(n.title||'제목 없는 메모')}</strong><span class="excerpt">${esc(noteText(n)||'내용을 입력해 보세요.')}</span><small>${formatMemoDate(n.updatedAt)}</small></button>`).join('')||'<div class="empty-note">검색 결과가 없어요.</div>'}
function noteCommand(action){const area=document.getElementById('memoBody');if(!area)return;area.focus();if(action==='checklist'){const block=document.createElement('div');block.className='memo-check-item';block.contentEditable='false';block.innerHTML='<button type="button" class="memo-check-box" data-note-check aria-label="완료 여부 변경"></button><span class="memo-check-text" contenteditable="true">할 일 입력</span>';area.append(block);area.append(document.createElement('p'));const target=block.querySelector('.memo-check-text');target.focus();const r=document.createRange();r.selectNodeContents(target);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}else{document.execCommand(action,false,null)}noteUpdate();queueMemoRefresh()}
function todoScreen(){const p=progress(),filter=state.todoFilter;let visible=tasks.filter(t=>filter==='today'?t.date===todayKey:filter==='upcoming'?t.date>todayKey&&!t.done:filter==='done'?t.done:true).sort((a,b)=>a.date.localeCompare(b.date));let count=visible.length;return `
${pageHeader('TASKS & NOTES','해야 할 일을 정리해요.','투두 하나마다 메모와 우선순위, 마감일을 연결해요',`<button class="primary" data-open="todo">${ico('plus')} 할 일 추가</button>`)}

function emptyUi(title,detail,action){return `<div class="empty-utility">${ico('sparkle')}<strong>${title}</strong><span>${detail}</span>${action||''}</div>`}
function trackerBars(){const first=weekBegin(today),data=Array.from({length:7},(_,i)=>({day:addDays(first,i),minutes:timeLogs.filter(l=>l.date===datekey(addDays(first,i))).reduce((n,l)=>n+l.minutes,0)})),peak=Math.max(...data.map(v=>v.minutes),30);return `<div class="tracker-graph">${data.map(v=>`<div class="tracker-barcol" title="${datekey(v.day)} · ${fmtDuration(v.minutes)}"><div class="bararea"><span style="font-size:10px;color:var(--sub)">${v.minutes?Math.round(v.minutes/60*10)/10+'h':''}</span><div class="barfill" style="--h:${Math.max(3,v.minutes/peak*100)}%"></div></div><label>${daynames[v.day.getDay()]}</label></div>`).join('')}</div>`}
function goalRow(g){const a=goalStatus(g);return `<div class="goal-row"><div class="goal-title-row"><strong>${esc(g.title)}</strong><span>${esc(a.label)}</span></div><div class="thin-progress"><div style="width:${a.pct}%"></div></div></div>`}
function ddayScreen(){return `${pageHeader('D-DAY & MILESTONES','디데이','중요한 날짜와 기념일을 한곳에서 관리해요',`<div class="title-actions"><button class="secondary" data-manage-categories>${ico('settings','sm')} 카테고리 관리</button><button class="primary" data-open-dday>${ico('plus')} 디데이 추가</button></div>`)}<div class="action-row"><span class="muted-label">고정된 날짜를 먼저, 그다음 가까운 순으로 보여줘요.</span></div>${categoryFilterBar('dday','디데이를 카테고리별로 골라 볼 수 있어요')}<div class="dday-list">${sortedDdays().filter(d=>matchesCategory(d.category,'dday')).map(d=>{const days=dateDiff(todayKey,ddayDate(d));return `<article class="card glass dday-large" style="--dd:${catOf(d.category).color}"><div class="dday-top"><span>${esc(d.emoji||'📅')}</span><button class="pin" data-toggle-dday-pin="${esc(d.id)}">${d.pinned?'★ 고정':'☆ 고정'}</button></div><div><div class="dday-big">${ddayText(d)}</div><strong>${esc(d.title)}</strong><small>${esc(ddayDate(d))} · ${esc(catOf(d.category).label)} ${d.yearly?'· 매년 반복':''}</small></div><button class="text-button" style="position:absolute;right:21px;bottom:20px" data-edit-dday="${esc(d.id)}">수정 ${ico('right','sm')}</button></article>`}).join('')||emptyUi('아직 등록된 디데이가 없어요','시험, 약속, 기념일을 추가해보세요.',`<button class="primary" data-open-dday>${ico('plus')} 디데이 만들기</button>`)}</div>`}

// v0.5 · Weekly + daily time journal
const pad2=n=>String(n).padStart(2,'0');
const minsOf=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5));
const hhmm=m=>`${pad2(Math.floor(m/60)%24)}:${pad2(m%60)}`;
const fmtShort=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;
function journalStart(t){let n=minsOf(t||'04:00');return n<240?n+1440:n}
function journalSpan(entry){let s=journalStart(entry.start||entry.time||'04:00');let end=(entry.end||'05:00');let em=minsOf(end);if(em<=minsOf(entry.start||entry.time||'04:00'))em+=1440;if(em<s)em+=1440;return {start:Math.max(240,s),end:Math.min(1680,em)}}
const asJdate=s=>parseDate(s);
function journalEntries(date,layer){if(layer==='actual')return timeLogs.filter(l=>l.date===date&&l.start&&l.end&&matchesCategory(l.category,'tracker')).map(l=>({...l,kind:'actual'}));const own=plannerPlans.filter(p=>p.date===date&&matchesCategory(p.category,'tracker')).map(p=>({...p,kind:'plan'}));const eventsForDay=events.filter(e=>e.date===date&&!e.allDay&&e.time&&e.end&&matchesCategory(e.category,'tracker')).map(e=>({id:e.id,date:e.date,start:e.time,end:e.end,title:e.title,category:e.category,kind:'event'}));return [...own,...eventsForDay]}
function journalBlockMarkup(b,day,layer,lane=0,lanes=1){const {start,end}=journalSpan(b),top=(start-240)*.6,h=Math.max(15,(end-start)*.6);if(h<=0)return '';let color=catOf(b.category).color;return `<button class="wk-block ${layer==='actual'?'actual':''} ${h<35?'compact':''}" style="--slot-color:${color};top:${top}px;height:${h}px;left:calc(${lane*100/lanes}% + 3px);right:auto;width:calc(${100/lanes}% - 6px)" data-journal-edit="${esc(b.kind)}" data-journal-id="${esc(b.id)}" title="${esc(b.title)} · ${esc(b.start||b.time)}—${esc(b.end)}"><span class="slot-text">${esc(b.title)}</span><span class="slot-time">${esc(b.start||b.time)}—${esc(b.end)}</span></button>`}
function journalBlockList(entries,date,layer){const sorted=entries.map(b=>({...b,_span:journalSpan(b)})).filter(b=>b._span.end>b._span.start).sort((a,b)=>a._span.start-b._span.start);const groups=[];let group=[],furthest=-1;for(const b of sorted){if(group.length&&b._span.start>=furthest){groups.push(group);group=[];furthest=-1}group.push(b);furthest=Math.max(furthest,b._span.end)}if(group.length)groups.push(group);return groups.map(g=>{const ends=[];const assigned=g.map(b=>{let lane=ends.findIndex(e=>e<=b._span.start);if(lane<0){lane=ends.length;ends.push(b._span.end)}else ends[lane]=b._span.end;return {b,lane}});return assigned.map(x=>journalBlockMarkup(x.b,date,layer,x.lane,ends.length)).join('')}).join('')}
function journalSlots(date,layer){return Array.from({length:24},(_,i)=>`<button class="wk-slot" style="top:${i*36}px" data-journal-slot="${layer}" data-date="${date}" data-hour="${(i+4)%24}" aria-label="${date} ${pad2((i+4)%24)}시 ${layer==='actual'?'실제 기록':'계획'} 추가" title="클릭하여 시간 블록 추가"></button>`).join('')}
function journalAxis(){return Array.from({length:24},(_,i)=>`<span class="wk-time-label" style="top:${i*36+4}px">${pad2((i+4)%24)}</span>`).join('')}
function journalHours(date,layer,day){const entries=journalEntries(date,layer);return `<div class="wk-timeline week-cell" data-journal-day="${date}">${journalSlots(date,layer)}${journalBlockList(entries,date,layer)}</div>`}
function journalDayTasks(date,compact=true){const t=tasks.filter(t=>t.date===date&&matchesCategory(t.category,'tracker')).sort((a,b)=>Number(a.done)-Number(b.done));return compact?t.slice(0,3).map(x=>`<button class="wk-todo ${x.done?'done':''}" data-toggle="${esc(x.id)}" title="완료 상태 변경"><span class="small-check">${x.done?'✓':''}</span><span>${esc(x.title)}</span></button>`).join(''):t.map(x=>`<div class="day-todo-row"><button class="small-check ${x.done?'done':''}" data-toggle="${esc(x.id)}" aria-label="${esc(x.title)} 완료 상태 변경">${x.done?'✓':''}</button><button class="text ${x.done?'done':''}" data-edit-task="${esc(x.id)}">${esc(x.title)}</button><span class="category-dot" style="width:9px;height:9px;border-radius:50%;background:${catOf(x.category).color}"></span></div>`).join('')}
function journalHabit(date,name){let id=date+'|'+name,checked=plannerHabits.includes(id);return `<button class="wk-habit ${checked?'done':''}" data-habit-date="${date}" data-habit-name="${esc(name)}">${esc(name)}</button>`}
function journalTop(){const view=state.trackerView,date=asJdate(state.trackerDate),start=weekBegin(date),end=addDays(start,6),dateText=view==='week'?`${fmtShort(start)} — ${fmtShort(end)}`:fmtLong.format(date),planned=plannerPlans.filter(p=>p.date===state.trackerDate&&matchesCategory(p.category,'tracker')).reduce((n,p)=>n+journalMinutes(p),0)+events.filter(e=>e.date===state.trackerDate&&!e.allDay&&matchesCategory(e.category,'tracker')).reduce((n,p)=>n+journalMinutes({start:p.time,end:p.end}),0),actual=timeLogs.filter(l=>l.date===state.trackerDate&&matchesCategory(l.category,'tracker')).reduce((n,l)=>n+(Number(l.minutes)||0),0),done=tasks.filter(t=>t.date===state.trackerDate&&t.done&&matchesCategory(t.category,'tracker')).length,total=tasks.filter(t=>t.date===state.trackerDate&&matchesCategory(t.category,'tracker')).length;return `${pageHeader('TIME JOURNAL','나만의 시간 기록','참고한 플래너처럼 계획과 실제 시간을 나란히 기록해요',`<button class="primary" data-new-journal="${view==='week'?state.weekLayer:'plan'}">${ico('plus','sm')} 시간 블록 추가</button>`)}
<div class="journal-head"><div class="segment"><button class="${view==='week'?'selected':''}" data-tracker-view="week">주간</button><button class="${view==='day'?'selected':''}" data-tracker-view="day">일간</button></div><div><div class="journal-range">${dateText}${view==='week'?` <span class="week-badge">${weekLabel(date)}</span>`:''}</div><div class="journal-sub">${view==='week'?`${weekLabel(date)} · 월요일부터 일요일까지`:'계획 vs 실제 사용 기록'}</div></div><div class="action-row"><button class="secondary" data-journal-move="prev" aria-label="이전 ${view==='week'?'주':'날짜'}">${ico('left','sm')}</button><button class="secondary" data-journal-today>오늘</button><button class="secondary" data-journal-move="next" aria-label="다음 ${view==='week'?'주':'날짜'}">${ico('right','sm')}</button><button class="secondary" data-nav="focus">${ico('timer','sm')} 집중</button></div></div>
${categoryFilterBar('tracker','시간표·투두·시간 기록에 모두 적용')}<div class="journal-mini"><div class="mini"><small>선택한 날 · 계획</small><strong>${fmtDuration(planned)}</strong></div><div class="mini"><small>선택한 날 · 실제</small><strong>${fmtDuration(actual)}</strong></div><div class="mini"><small>선택한 날 · 투두</small><strong>${done} / ${total}</strong></div></div>`}
function journalMinutes(x){if(!x.start||!x.end)return 0;let a=minsOf(x.start),b=minsOf(x.end);if(b<=a)b+=1440;return b-a}
function weeklyJournal(){const first=weekBegin(asJdate(state.trackerDate)),days=Array.from({length:7},(_,i)=>datekey(addDays(first,i))),layer=state.weekLayer;return `${journalTop()}<div class="journal-head" style="margin:0 0 12px"><div class="action-row" style="margin:0"><div class="segment"><button data-week-layer="plan" class="${layer==='plan'?'selected':''}">계획</button><button data-week-layer="actual" class="${layer==='actual'?'selected':''}">실제 사용</button></div><button class="secondary" data-manage-habits>${ico('settings','sm')} 습관 편집</button></div><div class="journal-hints"><span><i class="journal-swatch" style="background:#bcb0d6"></i> 카테고리별 시간 블록</span><span>빈 칸을 클릭해서 추가 · 블록을 클릭해서 수정</span></div></div>
<section class="journal-board"><div class="week-scroll"><div class="week-planner-grid">
<div class="wk-header wk-spacer week-cell">WEEK<br>PLAN</div>${days.map((d,i)=>`<button class="wk-header day week-cell ${d===state.trackerDate?'active':''}" data-journal-select="${d}"><strong>${asJdate(d).getDate()}</strong><small>${['월','화','수','목','금','토','일'][i]} · ${asJdate(d).getMonth()+1}월</small></button>`).join('')}
<div class="wk-section-label week-cell">할 일</div>${days.map(d=>`<div class="wk-list week-cell">${eventsOn(d).filter(e=>matchesCategory(e.category,'tracker')&&(e.allDay||isRange(e))).slice(0,2).map(e=>`<button class="wk-all-day" data-edit-event="${esc(e.id)}">${esc(e.title)}</button>`).join('')}${journalDayTasks(d)||'<div class="wk-empty">할 일 없음</div>'}</div>`).join('')}
<div class="wk-section-label week-cell">습관</div>${days.map(d=>`<div class="wk-habit-area week-cell">${plannerHabitNames.map(h=>journalHabit(d,h)).join('')||'<span class="wk-empty">습관을 추가해요</span>'}</div>`).join('')}

if(kind==='log'){const o=item||{title:'',date:todayKey,minutes:60,category:'basic',memo:'',start:'09:00',end:'10:00'};const isMeasured=item&&!(item.start&&item.end);fields=`${inputField('uTitle','활동 이름','text',o.title,'required maxlength="100"')}${inputField('uDate','기록 날짜','date',o.date,'required')}${isMeasured?inputField('uMinutes','측정된 시간 (분)','number',o.minutes,'required min="1" max="10080" step="1"'):`<div class="form-row">${inputField('uStart','시작 시간','time',o.start||'09:00','required')}${inputField('uEnd','종료 시간','time',o.end||'10:00','required')}</div>`}<div class="inline-manage"><div class="form-field"><label for="uCat">카테고리</label><select id="uCat" class="field-input">${categoryOptions(o.category,false)}</select></div><button type="button" class="secondary" data-manage-categories>${ico('settings','sm')} 관리</button></div><div class="form-field"><label for="uMemo">메모</label><textarea id="uMemo" class="field-input textarea">${esc(o.memo||'')}</textarea></div><p class="input-help">${isMeasured?'자동 측정 기록의 소요 시간을 직접 보정할 수 있어요.':'시작·종료 시각으로 소요 시간을 계산해요. 자정을 넘는 기록은 날짜별로 나눠 추가해 주세요.'}</p>`}
if(kind==='goal'){const o=item||{title:'',period:state.goalPeriod||'week',mode:'time',target:10,category:'all',current:0};fields=`${inputField('uTitle','목표 이름','text',o.title,'required maxlength="100" placeholder="예: 공부 10시간"')}<div class="form-row"><div class="form-field"><label for="uPeriod">기간</label><select class="field-input" id="uPeriod"><option value="week" ${o.period==='week'?'selected':''}>이번 주</option><option value="month" ${o.period==='month'?'selected':''}>이번 달</option></select></div><div class="form-field"><label for="uMode">목표 기준</label><select class="field-input" id="uMode"><option value="time" ${o.mode==='time'?'selected':''}>기록 시간 (시간)</option><option value="todo" ${o.mode==='todo'?'selected':''}>투두 완료 수 (개)</option><option value="manual" ${o.mode==='manual'?'selected':''}>직접 체크 (회)</option></select></div></div><div class="form-row"><div class="form-field"><label for="uTarget">목표량</label><input class="field-input" id="uTarget" type="number" min="1" step="1" max="10000" value="${o.target}" required></div><div class="inline-manage"><div class="form-field"><label for="uCat">연동 카테고리</label><select id="uCat" class="field-input">${categoryOptions(o.category,true)}</select></div><button type="button" class="secondary" data-manage-categories>${ico('settings','sm')} 관리</button></div></div><div class="form-field" id="manualField" ${o.mode!=='manual'?'hidden':''}><label for="uCurrent">현재 수동 달성량</label><input id="uCurrent" class="field-input" type="number" min="0" step="1" value="${o.manualProgress?.[periodId(o.period)]??o.current??0}"></div><p class="input-help">시간형·투두형은 선택한 카테고리의 기록으로 자동 계산돼요. 직접 체크형은 +/− 버튼으로 진행할 수 있어요.</p>`}
const title=({dday:'디데이',log:'시간 기록',goal:'목표'})[kind];document.getElementById('modalRoot').innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="utilityTitle"><div class="modal-head"><div><h2 id="utilityTitle">${title} ${editing?'수정':'추가'}</h2><small>${title}을 자유롭게 관리하세요.</small></div><button class="close-btn" data-close aria-label="닫기">${ico('close')}</button></div><form id="utilityForm" data-type="${kind}" data-id="${esc(id||'')}">${fields}<div class="form-foot">${editing?`<button type="button" class="danger" data-delete-utility="${kind}" data-item-id="${esc(id)}">${ico('trash','sm')} 삭제</button>`:'<span class="sample">이 브라우저에 저장돼요</span>'}<button type="submit" class="primary">${ico('check','sm')} 저장하기</button></div></form></div></div>`;document.getElementById('uTitle')?.focus()}
function saveUtility(form){const kind=form.dataset.type,id=form.dataset.id,title=document.getElementById('uTitle').value.trim();if(!title){toast('이름을 입력해 주세요.');return}const category=document.getElementById('uCat').value;let obj;if(kind==='dday'){const date=document.getElementById('uDate').value;if(!date){toast('날짜를 선택해 주세요.');return}obj={id:id||newId('d'),title,date,emoji:document.getElementById('uEmoji').value.trim()||'📅',category,yearly:document.getElementById('uYearly').checked,pinned:document.getElementById('uPinned').checked};ddays=id?ddays.map(x=>x.id===id?obj:x):[...ddays,obj]}
if(kind==='log'){const date=document.getElementById('uDate').value,start=document.getElementById('uStart')?.value,end=document.getElementById('uEnd')?.value;const measured=!!document.getElementById('uMinutes');const minutes=measured?Number(document.getElementById('uMinutes').value):(Number(end.slice(0,2))*60+Number(end.slice(3)))-(Number(start.slice(0,2))*60+Number(start.slice(3)));if(!date||!Number.isFinite(minutes)||minutes<=0||minutes>10080||!measured&&(!start||!end)){toast('기록 시간을 확인해 주세요.');return}const existing=timeLogs.find(x=>x.id===id);obj={id:id||newId('l'),title,date,minutes,category,memo:document.getElementById('uMemo').value.trim(),source:existing?.source||'manual'};if(!measured){obj.start=start;obj.end=end}timeLogs=id?timeLogs.map(x=>x.id===id?obj:x):[obj,...timeLogs]}
if(kind==='goal'){const period=document.getElementById('uPeriod').value,mode=document.getElementById('uMode').value,target=Number(document.getElementById('uTarget').value),current=Number(document.getElementById('uCurrent').value);if(!Number.isFinite(target)||target<=0||target>10000){toast('목표량을 올바르게 입력해 주세요.');return}obj={id:id||newId('g'),title,period,mode,target,category,current:mode==='manual'?Math.max(0,current||0):0,manualProgress:mode==='manual'?{...(goals.find(x=>x.id===id)?.manualProgress||{}),[periodId(period)]:Math.max(0,current||0)}:{}};goals=id?goals.map(x=>x.id===id?obj:x):[...goals,obj];state.goalPeriod=period}
saveExtra();closeModal();render();toast(`${({dday:'디데이',log:'기록',goal:'목표'})[kind]} 저장 완료!`)}
function handleClock(action){syncClocks();const now=Date.now();if(action==='pom-toggle'){if(pom.running){pom.running=false;pom.deadline=null}else{pom.running=true;pom.deadline=now+pom.remaining*1000}}
else if(action==='pom-reset'){pom.running=false;pom.deadline=null;pom.phase='focus';pom.remaining=focusConfig.focus*60;pom.cycle=0}
else if(action==='pom-settings'){const keys=[['focus',1,180],['short',1,60],['long',1,90],['cycles',2,8]];for(const [k,a,b] of keys){const n=Number(document.getElementById('cfg'+k[0].toUpperCase()+k.slice(1)).value);if(!Number.isInteger(n)||n<a||n>b){toast('시간과 횟수의 범위를 확인해 주세요.');return}focusConfig[k]=n}focusConfig.category=document.getElementById('cfgCategory').value;if(!pom.running){pom.remaining=(pom.phase==='focus'?focusConfig.focus:pom.phase==='short'?focusConfig.short:focusConfig.long)*60}toast('뽀모도로 설정을 적용했어요.')}
else if(action==='timer-toggle'){if(timer.running){timer.running=false;timer.deadline=null}else{if(timer.remaining<=0)timer.remaining=timer.duration;if(timer.remaining<=0){toast('타이머 시간을 먼저 설정해 주세요.');return}timer.running=true;timer.deadline=now+timer.remaining*1000}}
else if(action==='timer-set'){const m=Number(document.getElementById('timerMinutes').value),s=Number(document.getElementById('timerSeconds').value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>599||s<0||s>59||m*60+s<=0){toast('올바른 시간을 입력해 주세요.');return}if(timer.running){toast('일시정지 후 시간을 변경할 수 있어요.');return}timer.duration=m*60+s;timer.remaining=timer.duration;timer.elapsed=0}
else if(action==='timer-reset'){timer.running=false;timer.deadline=null;timer.remaining=timer.duration;timer.elapsed=0}
else if(action==='timer-save'){if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.deadline-now)/1000));timer.running=false;timer.deadline=null}const cat=document.getElementById('clockCategory')?.value||timer.category;timer.category=cat;const spent=Math.max(0,timer.duration-timer.remaining);if(spent<30){toast('30초 이상 측정한 뒤 기록해 주세요.');return}addTimedLog('타이머 측정',cat,spent/60,'타이머');timer.remaining=timer.duration;toast('타이머 기록을 저장했어요.')}
else if(action==='stopwatch-toggle'){if(stopwatch.running){stopwatch.elapsed=elapsedStopwatch();stopwatch.running=false;stopwatch.startedAt=null}else{stopwatch.running=true;stopwatch.startedAt=now}}
else if(action==='stopwatch-lap'){if(!stopwatch.running){toast('스톱워치를 시작한 뒤 랩을 기록해 주세요.');return}stopwatch.laps.push(elapsedStopwatch())}
else if(action==='stopwatch-reset'){stopwatch.elapsed=0;stopwatch.running=false;stopwatch.startedAt=null;stopwatch.laps=[]}
else if(action==='stopwatch-save'){const spent=elapsedStopwatch();if(spent<30){toast('30초 이상 측정한 뒤 기록해 주세요.');return}stopwatch.category=document.getElementById('clockCategory')?.value||stopwatch.category;addTimedLog('스톱워치 측정',stopwatch.category,spent/60,'스톱워치');stopwatch.elapsed=0;stopwatch.running=false;stopwatch.startedAt=null;stopwatch.laps=[];toast('스톱워치 기록을 저장했어요.')}
saveClocks();render()}

 if(options.auth!==false){await cloudEnsureSession();headers.Authorization='Bearer '+cloudSession.access_token}
 let res;
 try{res=await fetch(cloudConfig.url+path,{method:options.method||'GET',headers,body:options.body!==undefined?JSON.stringify(options.body):undefined})}
 catch(e){throw Error('클라우드 서버에 연결하지 못했어요. 인터넷과 주소를 확인해 주세요.')}
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=null}
 if(!res.ok){const msg=(data?.msg||data?.message||data?.error_description||data?.error||'요청 실패');throw Error(`${msg} (${res.status})`)}
 return data
}
function cloudSetSession(result){if(!result?.access_token||!result?.refresh_token||!result?.user?.id)throw Error('로그인 응답에 필요한 정보가 없어요.');cloudSession={access_token:result.access_token,refresh_token:result.refresh_token,user:result.user,expires_at:Date.now()+Number(result.expires_in||3600)*1000};cloudWrite(CLOUD_SESSION,cloudSession);cloudButtonState()}
let cloudRefreshPromise=null;
async function cloudEnsureSession(){
 if(!cloudSession?.refresh_token)throw Error('로그인이 필요해요.');
 if(cloudSession.access_token&&cloudSession.expires_at>Date.now()+90000)return;
 if(!cloudRefreshPromise)cloudRefreshPromise=(async()=>{
  try{const result=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{auth:false,method:'POST',body:{refresh_token:cloudSession.refresh_token}});cloudSetSession(result)}
  catch(e){cloudSession=null;cloudWrite(CLOUD_SESSION,null);cloudButtonState();throw Error('로그인 유효기간이 끝났어요. 다시 로그인해 주세요.')}finally{cloudRefreshPromise=null}
 })();
 return cloudRefreshPromise
}
async function cloudFetchRemote(){const uid=cloudSession.user.id;const query='/rest/v1/dayflow_snapshots?user_id=eq.'+encodeURIComponent(uid)+'&select=user_id,revision,payload,updated_at&limit=1';const rows=await cloudRequest(query);return Array.isArray(rows)?(rows[0]||null):null}
async function cloudUpload(force=false){
 if(cloudBusy)return;cloudBusy=true;
 try{
  const existing=await cloudFetchRemote();
  const uid=cloudSession.user.id,rev=Number(existing?.revision||0);
  if(!force&&rev!==Number(cloudBinding?.rev||0)){
   cloudConflict=true;cloudStatusMessage('다른 기기에서 데이터가 변경됐어요. 어느 데이터를 유지할지 선택해 주세요.',true);return
  }
  const snapshot=cloudSnapshot(),payload={user_id:uid,payload:snapshot,revision:rev+1,updated_at:new Date().toISOString()};
  let result;
  if(existing){result=await cloudRequest('/rest/v1/dayflow_snapshots?user_id=eq.'+encodeURIComponent(uid)+'&revision=eq.'+rev,{method:'PATCH',body:payload,headers:{Prefer:'return=representation'}})}
  else{result=await cloudRequest('/rest/v1/dayflow_snapshots',{method:'POST',body:payload,headers:{Prefer:'return=representation'}})}
  if(!Array.isArray(result)||result.length!==1){cloudConflict=true;throw Error('다른 기기에서 먼저 수정했어요. 동기화 충돌을 확인해 주세요.')}
  cloudBinding={userId:uid,rev:rev+1,fingerprint:cloudFingerprint(snapshot)};cloudWrite(CLOUD_BIND,cloudBinding);cloudConflict=false;cloudLastCheck=Date.now();cloudStatusMessage('클라우드에 저장됐어요.');cloudButtonState()
 }catch(e){cloudStatusMessage(e.message,true);throw e}finally{cloudBusy=false}
}
function cloudImport(row){
 const data=row?.payload;
 if(!data||typeof data!=='object'||Array.isArray(data))throw Error('클라우드 기록 형식이 올바르지 않아요.');
 if(Object.keys(data).some(k=>k.startsWith('dayflow-'))&&!Object.keys(data).some(k=>k.startsWith('hope-')))throw Error('기존 dayflow 클라우드 기록이 있어요. 새 hope를 빈 상태로 시작하려면 이 기기 데이터를 업로드해 교체해 주세요. 이전 기록은 먼저 백업하세요.');
 // No auth/session/config/binding credentials are ever included in snapshots.
 for(const k of CLOUD_KEYS){if(Object.prototype.hasOwnProperty.call(data,k)&&typeof data[k]==='string')localStorage.setItem(k,data[k]);else localStorage.removeItem(k)}
 cloudBinding={userId:cloudSession.user.id,rev:Number(row.revision||1),fingerprint:cloudFingerprint(cloudSnapshot())};cloudWrite(CLOUD_BIND,cloudBinding);
 cloudConflict=false;location.reload()
}
async function cloudDownload(){if(cloudBusy)return;cloudBusy=true;try{const r=await cloudFetchRemote();if(!r)throw Error('클라우드에 저장된 데이터가 아직 없어요.');cloudImport(r)}finally{cloudBusy=false}}
async function cloudFirstChoice(action){
 const r=await cloudFetchRemote();
 if(action==='pull'){
  if(!r)throw Error('아직 클라우드에 데이터가 없어요. 먼저 한 기기의 데이터를 업로드해 주세요.');
  if(!confirm('현재 기기의 일정과 메모가 클라우드 데이터로 교체돼요. 계속할까요?'))return;
  cloudImport(r);return
 }
 if(action==='push'){
  if(!confirm(r?'기존 클라우드 기록을 지금 보이는 hope 데이터로 완전히 교체할까요? 이전 일정·메모를 유지하려면 먼저 백업하세요.':'이 기기의 데이터를 클라우드에 첫 저장할까요?'))return;
  await cloudUpload(true);cloudDialog();return
 }
}
async function cloudSyncNow(){
 if(!cloudBound())return;
 if(cloudBusy)return;
 await cloudEnsureSession();
 const snapshot=cloudSnapshot(),dirty=cloudFingerprint(snapshot)!==cloudBinding.fingerprint;
 if(dirty){await cloudUpload();return}
 cloudBusy=true;
 try{const remote=await cloudFetchRemote();cloudLastCheck=Date.now();if(remote&&Number(remote.revision)!==Number(cloudBinding.rev)){
  cloudBusy=false;cloudImport(remote);return
 }cloudStatusMessage('최신 상태예요.');cloudButtonState()}
 catch(e){cloudStatusMessage(e.message,true);throw e}finally{cloudBusy=false}
}
async function cloudBackgroundSync(){
 if(document.hidden||!cloudBound()||cloudBusy||cloudConflict)return;
 try{await cloudSyncNow()}catch(e){}
}
const cloudEsc=s=>esc(s);
function cloudDialog(){
 const logged=!!cloudSession?.user?.id,paired=cloudBound(),email=cloudSession?.user?.email||'';
 const status=cloudConflict?'서로 다른 기기의 데이터가 충돌했어요.':paired?'자동 동기화가 연결됐어요.':logged?'로그인됐어요. 첫 데이터 선택이 필요해요.':'연결 전에는 이 기기에만 저장돼요.';
 const html=`<div class="overlay cloud-dialog" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cloudTitle"><div class="modal-head"><div><h2 id="cloudTitle">☁ 클라우드 동기화</h2><small>PC와 휴대폰의 데이터를 같은 계정으로 연결해요.</small></div><button class="close-btn" type="button" data-close aria-label="닫기">${ico('close')}</button></div>
 <div class="cloud-status ${cloudConflict?'error':paired?'ok':logged?'warn':''}"><i></i><div><strong>${status}</strong><p>${logged?'계정: '+cloudEsc(email):'로그인 전까지는 브라우저에만 기록돼요.'}</p></div></div>
 ${!cloudValidConfig()?`<p class="cloud-intro">먼저 Supabase 프로젝트와 데이터베이스 테이블을 만든 뒤 <strong>프로젝트 URL과 Publishable(또는 anon) 키</strong>를 입력해 주세요.</p>
 <form id="cloudConfigForm"><div class="form-field"><label for="cloudUrl">Supabase 프로젝트 URL</label><input class="field-input" id="cloudUrl" type="url" placeholder="https://프로젝트ID.supabase.co" required></div><div class="form-field"><label for="cloudKey">Publishable / anon 키 (공개 키)</label><input class="field-input" id="cloudKey" autocomplete="off" placeholder="sb_publishable_... 또는 eyJ..." required></div><p class="cloud-helper">기존에 실행한 dayflow_snapshots SQL 테이블을 그대로 사용하면 돼요. <strong>service_role / secret 키는 절대 입력하지 마세요.</strong></p><button class="primary" type="submit">연결 정보 저장</button></form>`:''}
 ${cloudValidConfig()&&!logged?`<form id="cloudAuthForm"><div class="form-field"><label for="cloudEmail">이메일</label><input class="field-input" id="cloudEmail" type="email" autocomplete="username" placeholder="example@email.com" required></div><div class="form-field"><label for="cloudPassword">비밀번호 (최소 6자)</label><input class="field-input" id="cloudPassword" type="password" autocomplete="current-password" minlength="6" required></div><div class="cloud-actions"><button class="primary" name="login" type="submit" data-cloud-auth="login">로그인</button><button class="secondary" name="signup" type="submit" data-cloud-auth="signup">회원가입</button></div><p class="cloud-helper">회원가입 시 이메일 인증 메일이 전송될 수 있어요. 인증 후 같은 이메일과 비밀번호로 로그인해 주세요.</p></form>`:''}
 ${logged&&!paired?`<p class="cloud-note">첫 연결은 안전을 위해 자동으로 데이터를 덮어쓰지 않아요. 어느 쪽 기록을 기준으로 할지 선택해 주세요.</p><div class="cloud-actions"><button class="secondary" data-cloud-action="pull">☁ 클라우드 데이터 가져오기</button><button class="primary" data-cloud-action="push">↑ 이 기기 데이터를 업로드</button></div>`:''}
 ${paired?`<p class="cloud-note">자동 동기화: 이 기기에서 수정한 내용은 인터넷 연결 시 업로드되고, 다른 기기의 변경을 주기적으로 확인해요.<br>동시에 서로 다르게 수정하면 <strong>충돌을 알리고 자동 덮어쓰기를 중지</strong>해요.</p><div class="cloud-actions"><button class="primary" data-cloud-action="sync">↻ 지금 동기화</button><button class="secondary" data-cloud-action="pull">☁ 클라우드 기록으로 복원</button><button class="secondary" data-cloud-action="push">↑ 이 기기 기록으로 덮어쓰기</button><button class="secondary" data-cloud-action="disconnect">이 기기 동기화 해제</button></div>`:''}
 <div class="cloud-divider"></div><div class="cloud-toolbar"><button class="secondary" data-cloud-action="backup">${ico('note','sm')} 이 기기 백업 다운로드</button>${logged?'<button class="secondary" data-cloud-action="logout">로그아웃</button>':''}${cloudValidConfig()?'<button class="secondary" data-cloud-action="resetconfig">연결 설정 변경</button>':''}</div>
 <p class="cloud-helper">로그인 비밀번호는 앱에 저장하지 않아요. 인증 세션과 연결 설정은 이 브라우저에 저장돼요. 타이머의 현재 카운트다운은 기기별로 유지돼요.</p><p id="cloudResult" class="cloud-error-text" aria-live="polite">${cloudEsc(cloudError)}</p></div></div>`;
 document.getElementById('modalRoot').innerHTML=html;
 const form=document.getElementById('cloudConfigForm');if(form)form.addEventListener('submit',async e=>{e.preventDefault();let url=document.getElementById('cloudUrl').value.trim().replace(/\/+$/,'');const key=document.getElementById('cloudKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||key.length<12){cloudStatusMessage('프로젝트 URL과 공개 키를 확인해 주세요.',true);return}cloudConfig={url,key};cloudWrite(CLOUD_CFG,cloudConfig);cloudError='';cloudDialog()});
 const auth=document.getElementById('cloudAuthForm');if(auth)auth.addEventListener('submit',async e=>{e.preventDefault();const submitter=e.submitter;const mode=submitter?.dataset?.cloudAuth||'login';const email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value;submitter.disabled=true;try{
  const result=await cloudRequest(mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});
  if(result?.access_token){cloudSetSession(result);cloudConflict=false;cloudError='';cloudDialog()}
  else cloudStatusMessage('가입 신청 완료! 이메일에서 인증한 뒤 로그인해 주세요.')
 }catch(err){cloudStatusMessage(err.message,true)}finally{submitter.disabled=false}});
 const overlay=document.querySelector('.cloud-dialog');overlay?.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-cloud-action]');if(!btn)return;e.preventDefault();e.stopPropagation();const action=btn.dataset.cloudAction;
  if(action==='backup'){const blob=new Blob([JSON.stringify({format:'hope-backup-v1',createdAt:new Date().toISOString(),payload:cloudSnapshot()},null,2)],{type:'application/json'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download='hope-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
  if(action==='logout'||action==='disconnect'||action==='resetconfig'){
   if(action==='resetconfig'&&!confirm('클라우드 연결 설정을 지울까요? 기기에 저장된 일정은 유지돼요.'))return;
   if(action==='logout'||action==='resetconfig'){cloudSession=null;cloudWrite(CLOUD_SESSION,null)}
   if(action==='resetconfig'){cloudConfig=null;cloudWrite(CLOUD_CFG,null)}
   cloudBinding=null;cloudWrite(CLOUD_BIND,null);cloudConflict=false;cloudError='';cloudDialog();cloudButtonState();return
  }
  btn.disabled=true;
  try{if(action==='pull'||action==='push')await cloudFirstChoice(action);else if(action==='sync'){await cloudSyncNow();cloudDialog()}}
  catch(err){cloudStatusMessage(err.message,true)}finally{btn.disabled=false}
 });
}
async function cloudBoot(){
 if(!cloudValidConfig()||!cloudSession)return;
 try{await cloudEnsureSession();if(cloudBound()){
  const row=await cloudFetchRemote();if(!row){cloudConflict=true;cloudStatusMessage('클라우드 기록을 찾을 수 없어요. 확인해 주세요.',true);return}
  const localFp=cloudFingerprint(cloudSnapshot()),dirty=localFp!==cloudBinding.fingerprint;
  if(row.revision!==cloudBinding.rev&&dirty){cloudConflict=true;cloudStatusMessage('두 기기에서 각각 수정한 내용이 있어요. 충돌을 해결해 주세요.',true)}
  else if(row.revision!==cloudBinding.rev&&!dirty){cloudImport(row);return}
  else if(dirty)await cloudUpload();
  cloudLastCheck=Date.now()
 }}catch(e){cloudStatusMessage(e.message,true)}finally{cloudButtonState()}
}
function cloudWire(){const el=document.getElementById('cloudSyncBtn');if(el){el.innerHTML=ico('info');el.addEventListener('click',cloudDialog)}cloudButtonState();cloudBoot();setInterval(cloudBackgroundSync,4500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudBackgroundSync()})}
cloudWire();

})();
</script>
